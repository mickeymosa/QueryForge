name: QueryForge backend build and tests

on:
  push:
    branches:
      - 'feat/backend-mvp-v0.1'
    paths:
      - 'src/QueryForge.Api/**'
      - 'src/QueryForge.PipelineCore/**'
      - 'tests/QueryForge.Api.Tests/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'src/QueryForge.Api/**'
      - 'tests/QueryForge.Api.Tests/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/QueryForge.Api.Tests/QueryForge.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/QueryForge.Api.Tests/QueryForge.Api.Tests.csproj --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test tests/QueryForge.Api.Tests/QueryForge.Api.Tests.csproj --no-restore --configuration Release --no-build
      - name: Publish API
        run: dotnet publish src/QueryForge.Api/QueryForge.Api.csproj --no-restore -c Release -o ./publish

  local-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local API and PostgreSQL
        run: docker compose up --build -d
      - name: Verify API, upload, report, and metric
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..35}; do
            if curl -fsS http://127.0.0.1:5080/api/health > /tmp/health.json; then break; fi
            sleep 3
          done
          jq -e '.status == "ok"' /tmp/health.json
          curl -fsS -F "file=@src/QueryForge.Api/wwwroot/samples/orders.csv" \
            http://127.0.0.1:5080/api/datasets > /tmp/upload.json
          jq -e '.quality.rowCount == 7' /tmp/upload.json
          jq -e '[.quality.issues[] | select(.code == "MIXED_CURRENCY")] | length == 2' /tmp/upload.json
          ID=$(jq -r '.id' /tmp/upload.json)
          curl -fsS "http://127.0.0.1:5080/api/datasets/$ID/metrics?column=amount" > /tmp/metric.json
          jq -e '.metric.includedRows == 2 and .metric.excludedRows == 5 and .metric.sum == 350.5' /tmp/metric.json
          curl -fsS http://127.0.0.1:5080/api/datasets > /tmp/datasets-before-etl.json
          BEFORE_COUNT=$(jq 'length' /tmp/datasets-before-etl.json)
          echo 'Preparing the ETL pipeline'
          cat > /tmp/etl-request.json <<'JSON'
          {"pipelineName":"Demo Basic ETL","steps":[{"operation":"Trim"},{"operation":"DropDuplicates","column":"order_id"}]}
          JSON
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/etl-request.json \
            "http://127.0.0.1:5080/api/datasets/$ID/etl/preview" > /tmp/etl-preview.json
          jq -e '.rowCountBefore == 7 and .rowCountAfter == 6 and .audit[1].affectedRows == 1' /tmp/etl-preview.json
          jq -e '.audit[0].affectedRows >= 1' /tmp/etl-preview.json
          curl -fsS http://127.0.0.1:5080/api/datasets > /tmp/datasets-after-preview.json
          test "$(jq 'length' /tmp/datasets-after-preview.json)" -eq "$BEFORE_COUNT"
          PREVIEW_HASH=$(jq -r '.previewFingerprint' /tmp/etl-preview.json)
          jq --arg hash "$PREVIEW_HASH" '. + {previewFingerprint: $hash}' \
            /tmp/etl-request.json > /tmp/etl-apply.json
          curl -fsS -H 'Content-Type: application/json' --data-binary @/tmp/etl-apply.json \
            "http://127.0.0.1:5080/api/datasets/$ID/etl/apply" > /tmp/etl-saved.json
          jq -e --arg original "$ID" \
            '.rowCount == 6 and .sourceDatasetId == $original and .quality.lineage.parentDatasetId == $original' \
            /tmp/etl-saved.json
          curl -fsS "http://127.0.0.1:5080/api/datasets/$ID/preview?limit=1" > /tmp/unaltered-source.json
          jq -e '.rows[0].customer == " Ahmed "' /tmp/unaltered-source.json
          curl -fsS http://127.0.0.1:5080/api/datasets > /tmp/datasets-after-apply.json
          test "$(jq 'length' /tmp/datasets-after-apply.json)" -eq "$((BEFORE_COUNT+1))"
          DERIVED_ID=$(jq -r '.id' /tmp/etl-saved.json)
          curl -fsS "http://127.0.0.1:5080/api/datasets/$DERIVED_ID" > /tmp/etl-loaded.json
          jq -e '.quality.lineage.originalRowNumbers | length == 6' /tmp/etl-loaded.json
          curl -fsS "http://127.0.0.1:5080/api/datasets/$DERIVED_ID/metrics?column=amount" > /tmp/etl-metric.json
          jq -e '.metric.sum == 350.5 and .metric.includedRows == 2' /tmp/etl-metric.json
          curl -fsS "http://127.0.0.1:5080/etl.html?dataset=$DERIVED_ID" > /tmp/etl-ui.html
          grep -q 'Advanced mode' /tmp/etl-ui.html
          echo "Verifying a >10 MiB CSV upload on the real ASP.NET API"
          python3 - <<'PY'
          with open("/tmp/queryforge-over-10mb.csv", "w", encoding="utf-8", newline="") as out:
              out.write("order_id,amount,currency,notes\n")
              for i in range(13000):
                  out.write(f"R{i:05d},1,EUR," + "X" * 850 + "\n")
          PY
          test "$(stat -c %s /tmp/queryforge-over-10mb.csv)" -gt 10485760
          LEGACY_STATUS=$(curl -sS -o /tmp/legacy-big-error.json -w '%{http_code}' \
            -F "file=@/tmp/queryforge-over-10mb.csv" http://127.0.0.1:5080/api/datasets)
          test "$LEGACY_STATUS" -eq 400
          jq -e '.error | contains("2 MiB")' /tmp/legacy-big-error.json
          curl --max-time 180 -fsS -F "file=@/tmp/queryforge-over-10mb.csv" \
            http://127.0.0.1:5080/api/v2/datasets > /tmp/queryforge-large-result.json
          jq -e '.rowCount == 13000 and .missingValues == 0 and .duplicateIds == 0' /tmp/queryforge-large-result.json
          LARGE_ID=$(jq -r '.id' /tmp/queryforge-large-result.json)
          curl -fsS "http://127.0.0.1:5080/api/v2/datasets/$LARGE_ID/rows?offset=12975&limit=25" > /tmp/queryforge-last-page.json
          jq -e '.totalRows == 13000 and (.rows | length) == 25 and .hasMore == false' /tmp/queryforge-last-page.json
          SQL_ROWS=$(docker compose exec -T database psql -U queryforge -d queryforge -Atc "SELECT COUNT(*) FROM stream_dataset_rows WHERE dataset_id = '$LARGE_ID';")
          test "$SQL_ROWS" -eq 13000
          echo "Relational storage: 13,000 individual rows, no giant dataset JSON blob"
          echo "Checking oversize and excessive-row upload rejection"
          python3 - <<'PY'
          with open('/tmp/queryforge-too-large.csv','wb') as f:
              f.write(b'order_id,amount\n')
              f.write(b'X' * (26 * 1024 * 1024))
          with open('/tmp/queryforge-too-many-rows.csv','w',encoding='utf-8') as f:
              f.write('order_id,amount\n')
              for i in range(30001):
                  f.write(f'R{i},1\n')
          PY
          TOO_LARGE_STATUS=$(curl --max-time 180 -sS -o /tmp/oversize-response.txt \
            -w '%{http_code}' -F 'file=@/tmp/queryforge-too-large.csv' \
            http://127.0.0.1:5080/api/v2/datasets)
          test "$TOO_LARGE_STATUS" -ge 400
          TOO_MANY_STATUS=$(curl --max-time 180 -sS -o /tmp/overrows-response.json \
            -w '%{http_code}' -F 'file=@/tmp/queryforge-too-many-rows.csv' \
            http://127.0.0.1:5080/api/v2/datasets)
          test "$TOO_MANY_STATUS" -eq 400
          jq -e '.error | contains("30,000")' /tmp/overrows-response.json
          # Transaction rollback: the invalid import must never leave a dataset or partial rows.
          INVALID_DATASETS=$(docker compose exec -T database psql -U queryforge -d queryforge -Atc "SELECT COUNT(*) FROM stream_datasets;")
          test "$INVALID_DATASETS" -eq 1
          curl -fsS http://127.0.0.1:5080/ingest.html > /tmp/ingest.html
          grep -q 'Safe Ingestion' /tmp/ingest.html
          curl -fsS http://127.0.0.1:5080/assets/qf-modern.css > /tmp/qf-modern.css
          grep -q 'prefers-reduced-motion' /tmp/qf-modern.css
          curl -fsS http://127.0.0.1:5080/assets/qf-enhance.js > /tmp/qf-enhance.js
          grep -q 'dragover' /tmp/qf-enhance.js
          node --check /tmp/qf-enhance.js
          echo "Checking Analytics Studio and evidence-based report endpoints"
          curl -fsS "http://127.0.0.1:5080/api/datasets/$ID/insights" > /tmp/qf-insights.json
          jq -e '.rowCount == 7 and (.suggestedCharts | length > 0)' /tmp/qf-insights.json
          curl -fsS "http://127.0.0.1:5080/api/datasets/$ID/advisor/report" > /tmp/qf-report.json
          jq -e '.aiEnabled == false and (.executiveSummary | contains("7 records"))' /tmp/qf-report.json
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"kind":"CountByCategory","column":"currency","excludeFlaggedRows":false}' \
            "http://127.0.0.1:5080/api/datasets/$ID/charts/preview" > /tmp/qf-chart.json
          jq -e '.kind == "CountByCategory" and (.points | map(.value) | add) == 7' /tmp/qf-chart.json
          MIXED_STATUS=$(curl -sS -o /tmp/mixed-chart-error.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"kind":"SumByCategory","column":"currency","measure":"amount","excludeFlaggedRows":false}' \
            "http://127.0.0.1:5080/api/datasets/$ID/charts/preview")
          test "$MIXED_STATUS" -eq 400
          jq -e '.error | contains("mixed or missing currencies")' /tmp/mixed-chart-error.json
          curl -fsS "http://127.0.0.1:5080/analytics.html?dataset=$ID" > /tmp/qf-analytics-ui.html
          grep -q 'Analytics Studio' /tmp/qf-analytics-ui.html
          curl -fsS http://127.0.0.1:5080/assets/qf-analytics.js > /tmp/qf-analytics.js
          curl -fsS http://127.0.0.1:5080/assets/qf-etl-canvas.js > /tmp/qf-etl-canvas.js
          node --check /tmp/qf-analytics.js
          node --check /tmp/qf-etl-canvas.js
          curl -fsS "http://127.0.0.1:5080/api/datasets/$ID/advisor/workflow" > /tmp/qf-workflow.json
          jq -e '.usesExternalAi == false and .humanApprovalRequired == true' /tmp/qf-workflow.json
          jq -e '(.readOnlyPreviews | length) >= 1' /tmp/qf-workflow.json
          curl -fsS "http://127.0.0.1:5080/assets/qf-report-print.css" > /tmp/qf-print.css
          grep -q '@media print' /tmp/qf-print.css
          curl -fsS "http://127.0.0.1:5080/assets/qf-etl-canvas.css" > /tmp/qf-canvas.css
          echo "Analytics insights/charts/report and JavaScript syntax smoke test passed"
          echo 'Testing versioned pipeline compilation and DuckDB demo execution'
          cat > /tmp/pipeline-demo.json <<'JSON'
          {
            "schemaVersion": 1,
            "nodes": [
              {"id":"total","kind":"Aggregate","aggregate":{"groupBy":"currency","function":"Sum","measure":"amount","outputColumn":"total"}},
              {"id":"positive","kind":"Filter","filter":{"column":"amount","comparison":"GreaterThan","value":"0"}},
              {"id":"source","kind":"Source","source":{"datasetKey":"demo_orders"}}
            ],
            "edges":[{"from":"positive","to":"total"},{"from":"source","to":"positive"}],
            "outputNodeId":"total"
          }
          JSON
          curl -fsS -H 'Content-Type: application/json' \
            --data-binary @/tmp/pipeline-demo.json \
            http://127.0.0.1:5080/api/pipelines/compile > /tmp/pipeline-compiled.json
          jq -e '.orderedNodeIds == ["source","positive","total"] and .parameterCount == 1' /tmp/pipeline-compiled.json
          curl -fsS -H 'Content-Type: application/json' \
            --data-binary @/tmp/pipeline-demo.json \
            http://127.0.0.1:5080/api/pipelines/demo/preview > /tmp/pipeline-preview.json
          jq -e '.rowCountReturned == 2 and .sourceIsSynthetic == true' /tmp/pipeline-preview.json
          jq -e '(.rows | map(select(.currency=="EUR") | .total) | add) == 325' /tmp/pipeline-preview.json
          jq -e '(.rows | map(select(.currency=="USD") | .total) | add) == 50' /tmp/pipeline-preview.json
          jq '.nodes |= map(if .kind == "Source" then .source.datasetKey="user_provided_path" else . end)' \
            /tmp/pipeline-demo.json > /tmp/pipeline-rejected.json
          BAD_SOURCE_STATUS=$(curl -sS -o /tmp/pipeline-rejected-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/pipeline-rejected.json \
            http://127.0.0.1:5080/api/pipelines/demo/preview)
          test "$BAD_SOURCE_STATUS" -eq 400
          jq -e '.error | contains("not approved")' /tmp/pipeline-rejected-response.json
          echo 'Testing new local Studio UI and optional AI disabled state'
          curl -fsS http://127.0.0.1:5080/ > /tmp/qf-studio.html
          grep -q 'Bring your data to life' /tmp/qf-studio.html
          grep -q 'stepColumnFree' /tmp/qf-studio.html
          curl -fsS http://127.0.0.1:5080/legacy.html > /tmp/qf-legacy.html
          grep -q 'Your data deserves a second look' /tmp/qf-legacy.html
          curl -fsS http://127.0.0.1:5080/assets/qf-studio.js > /tmp/qf-studio.js
          curl -fsS http://127.0.0.1:5080/assets/qf-studio.css > /tmp/qf-studio.css
          node --check /tmp/qf-studio.js
          grep -q 'prefers-reduced-motion' /tmp/qf-studio.css
          curl -fsS http://127.0.0.1:5080/api/studio/assistant/status > /tmp/studio-ai-status.json
          jq -e '.configured == false and .mode == "not-configured"' /tmp/studio-ai-status.json
          curl -fsS -F 'file=@src/QueryForge.Api/wwwroot/samples/orders.csv' \
            http://127.0.0.1:5080/api/studio/import > /tmp/studio-csv.json
          jq -e '.rowCount == 7 and .fileMode == "editable-small-data"' /tmp/studio-csv.json
          STUDIO_ID=$(jq -r '.id' /tmp/studio-csv.json)
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"pipelineName":"Visual Studio ETL","steps":[{"operation":"Trim"},{"operation":"DropDuplicates","column":"order_id"}]}' \
            "http://127.0.0.1:5080/api/datasets/$STUDIO_ID/etl/preview" > /tmp/studio-preview.json
          jq -e '.rowCountAfter == 6 and .audit[1].affectedRows == 1' /tmp/studio-preview.json
          echo 'Creating a real OpenXML .xlsx workbook with Python stdlib (no external test dependencies)'
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from xml.sax.saxutils import escape
          p='/tmp/queryforge-studio-test.xlsx'
          types='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'
          root='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'
          workbook='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Orders" sheetId="1" r:id="rId1"/></sheets></workbook>'
          rels='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'
          def txt(ref,value):
              return '<c r="'+ref+'" t="inlineStr"><is><t>'+escape(value)+'</t></is></c>'
          rows=[
              '<row r="1">'+txt('A1','order_id')+txt('B1','amount')+txt('C1','currency')+'</row>',
              '<row r="2">'+txt('A2','X001')+'<c r="B2"><v>50</v></c>'+txt('C2','EUR')+'</row>',
              '<row r="3">'+txt('A3','X002')+'<c r="B3"><v>25</v></c>'+txt('C3','EUR')+'</row>'
          ]
          sheet='<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:C3"/><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><sheetData>'+''.join(rows)+'</sheetData></worksheet>'
          with ZipFile(p,'w',ZIP_DEFLATED) as z:
              for name,body in [
                  ('[Content_Types].xml',types),('_rels/.rels',root),('xl/workbook.xml',workbook),
                  ('xl/_rels/workbook.xml.rels',rels),('xl/worksheets/sheet1.xml',sheet)
              ]:
                  z.writestr(name,body)
          print('Created',p)
          PY
          curl -fsS -F 'file=@/tmp/queryforge-studio-test.xlsx' \
            http://127.0.0.1:5080/api/studio/import > /tmp/studio-xlsx.json
          jq -e '.rowCount == 2 and .headers == ["order_id","amount","currency"]' /tmp/studio-xlsx.json
          XLSX_ID=$(jq -r '.id' /tmp/studio-xlsx.json)
          curl -fsS "http://127.0.0.1:5080/api/datasets/$XLSX_ID/preview?limit=2" > /tmp/xlsx-preview.json
          jq -e '.rows[0].amount == "50" and .rows[1].amount == "25"' /tmp/xlsx-preview.json
          printf 'garbage' > /tmp/queryforge-unsupported.txt
          STUDIO_INVALID=$(curl -sS -o /tmp/studio-invalid.json -w '%{http_code}' \
            -F 'file=@/tmp/queryforge-unsupported.txt' http://127.0.0.1:5080/api/studio/import)
          test "$STUDIO_INVALID" -eq 400
          echo 'Local Studio HTML/JavaScript, CSV, XLSX and ETL integration checks passed'
          echo 'Typed DAG compiler and DuckDB deterministic demo checks passed'
          echo "HTTP/database/upload/ETL-preview/ETL-apply/provenance/metric smoke test passed"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local containers
        if: always()
        run: docker compose down -v
