services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queryforge
      POSTGRES_PASSWORD: local_dev_only_replace_me
      POSTGRES_DB: queryforge
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryforge -d queryforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - queryforge_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/QueryForge.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      LocalAi__Model: "${QUERYFORGE_OLLAMA_MODEL:-}"
      Ai__Provider: "${QUERYFORGE_AI_PROVIDER:-ollama}"
      Ai__Model: "${QUERYFORGE_AI_MODEL:-gpt-4.1-mini}"
      Ai__ApiKey: "${QUERYFORGE_AI_API_KEY:-}"
      LocalAi__ChatEndpoint: "http://host.docker.internal:11434/api/chat"
      ConnectionStrings__QueryForge: "Host=database;Port=5432;Database=queryforge;Username=queryforge;Password=local_dev_only_replace_me"
    ports:
      - "127.0.0.1:5080:8080"

volumes:
  queryforge_pgdata:
